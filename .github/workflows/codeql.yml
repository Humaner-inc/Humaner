name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript / TypeScript)
    # Uploading results to a private repository needs GitHub Code Security.
    # It is free on public repositories, so this runs on the public Self-Host
    # repo (this file is projected there) and is skipped in the private one.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      # actions: read lets CodeQL look up its own workflow run (required for
      # private repositories); security-events: write uploads the results.
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:javascript-typescript"
