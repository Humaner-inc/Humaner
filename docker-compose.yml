# Humaner Self-Host — dashboard + Postgres + IMAP IDLE
# Usage:
#   export AUTH_SECRET="$(openssl rand -base64 32)"
#   docker compose up --build
#
# The idle worker is required for live mail. It is a long-lived process, not
# part of the Next.js dashboard image. Railway: add a second service using
# apps/dashboard/railway.imap-idle.toml (see SELFHOST.md).

services:
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_DEPLOYMENT_MODE: oss
      DATABASE_URL: postgresql://humaner:humaner@postgres:5432/humaner
      DIRECT_URL: postgresql://humaner:humaner@postgres:5432/humaner
      # Required — entrypoint rejects missing/placeholder values
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET with openssl rand -base64 32}
      AUTH_TRUST_HOST: 'true'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      KNOWLEDGE_DIR: /app/data/knowledge
    volumes:
      - ./data/knowledge:/app/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy

  imap-idle:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.imap-idle
    environment:
      NEXT_PUBLIC_DEPLOYMENT_MODE: oss
      IMAP_IDLE_ENABLED: 'true'
      DATABASE_URL: postgresql://humaner:humaner@postgres:5432/humaner
      DIRECT_URL: postgresql://humaner:humaner@postgres:5432/humaner
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET with openssl rand -base64 32}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: humaner
      POSTGRES_PASSWORD: humaner
      POSTGRES_DB: humaner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U humaner']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
